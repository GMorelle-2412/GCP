<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GCP</title>
    <link rel="icon" type="image/png" href="image/icone.png">
    <link rel="stylesheet" href="main.css">
</head>

<body>
    <div id="head_page">
        <img src="image/icone.png" alt="icon">

        <h1>GCP</h1>

        <div id="CetI">
            <button id="Connection" onclick="connection()">Connection</button>
            <button id="Inscription" onclick="inscription()">Inscription</button>
        </div>

    </div>

    <div id="contenu_page">
        <p>Connectez-vous pour pouvoir créer des éléments</p>

        <button id="Create_element">Créer un élément</button>

        <div id="overlay_inscription">
            <div id="inscription"></div>
        </div>

        <div id="overlay_connection">
            <div id="connection"></div>
        </div>
    </div>

    <script src="main.js"></script>
</body>

</html>
